---
- name: Gather the list of test images to mirror
  vars:
    _oc_uid: "{{ oc_container_uid | default(lookup('community.general.random_string', length=8, special=false), true) }}"
    _kube_path: /tmp/kubeconfig
    _oc_run_cmd: >-
      set -o pipefail;
      openshift-tests images --to-repository {{ oc_registry }}/{{ oc_mirror_org }}
    _oc_vols: >-
      {{
         [oc_kubeconfig ~ ':' ~ _kube_path ~ ':ro,Z']
         + ([oc_ca_cert ~ ':/additional-ca/cert.pem:ro,Z'] if (oc_ca_cert | length) else [])
      }}
    _oc_env: >-
      {{
        {'KUBECONFIG': _kube_path}
        | combine({'SSL_CERT_DIR': '/additional-ca'} if (oc_ca_cert | length) else {})
      }}
  containers.podman.podman_container:
    name: "ocp-conformance-imgs-{{ _oc_uid }}"
    image: "{{ oc_image }}"
    pull: newer
    detach: false
    remove: true
    user: "{{ oc_container_user }}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    volumes: "{{ _oc_vols }}"
    env: "{{ _oc_env }}"
    command:
      - bash
      - -c
      - "{{ _oc_run_cmd }}"
  register: _oc_images
  failed_when: false
  #no_log: true

- name: Mirror the test images into the local registry
  ansible.builtin.include_role:
    name: redhatci.ocp.mirror_images
  vars:
    mi_images: >-
      {{ _oc_images.stdout_lines
         | select('ansible.builtin.search', oc_registry)
         | map('regex_replace', oc_registry ~ '.*$', '')
         | map('trim')
         | list
         | unique
      }}
    mi_registry: "{{ oc_registry }}"
    mi_dst_org: "{{ oc_mirror_org }}"
    mi_authfile: "{{ oc_registry_auth }}"
    mi_is_type: idms
