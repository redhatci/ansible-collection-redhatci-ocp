---
- name: Delete Image Source from cluster
  kubernetes.core.k8s:
    state: absent
    definition: "{{ lookup('file', scorecard_is_file) }}"
  when: scorecard_is_file is defined

- name: Wait for MCP status
  ansible.builtin.include_role:
    name: redhatci.ocp.check_resource
  vars:
    resource_to_check: "MachineConfigPool"
    check_wait_retries: 60
    check_wait_delay: 20
  when: scorecard_is_file is defined

- name: Remove tmp directory
  ansible.builtin.file:
    path: "{{ scorecard_tmp_dir.path }}"
    state: absent
  when: scorecard_tmp_dir is defined

- name: Remove scorecard Image Source file
  ansible.builtin.file:
    path: "{{ scorecard_is_file }}"
    state: absent
  when: scorecard_is_file is defined

- name: Remove operator_sdk_img built from the source
  ansible.builtin.command: podman rmi {{ operator_sdk_img }}
  register: _operator_sdk_rmi
  failed_when: false
  changed_when: _operator_sdk_rmi.rc == 0
  when:
    - operator_sdk_source_dir is defined
    - operator_sdk_img_built | default(false) | bool

# The removal task above cannot fail the always: block, so surface any
# failure other than "image is in use by a container" instead of hiding it.
- name: Warn when operator_sdk_img could not be removed
  ansible.builtin.debug:
    msg: >-
      podman rmi {{ operator_sdk_img }} returned rc={{
      _operator_sdk_rmi.rc | default(0) }}: {{
      _operator_sdk_rmi.stderr | default('') | trim }}
  changed_when: false
  when: _operator_sdk_rmi.rc | default(0) != 0
...
