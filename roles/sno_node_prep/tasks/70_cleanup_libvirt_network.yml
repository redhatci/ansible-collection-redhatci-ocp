---
- name: Does network exist
  community.libvirt.virt_net:
    name: "{{ network['name'] }}"
    command: status
    changed_when: true
  register: network_exists
  become: true
  ignore_errors: true
  tags:
    - cleanup

- name: Stop SNO network
  community.libvirt.virt_net:
    command: destroy
    changed_when: true
    name: "{{ network['name'] }}"
  become: true
  when:
    - not network_exists.failed
  tags:
    - cleanup

- name: Undefine SNO network
  community.libvirt.virt_net:
    command: undefine
    changed_when: true
    name: "{{ network['name'] }}"
  become: true
  when:
    - not network_exists.failed
  tags:
    - cleanup
...
