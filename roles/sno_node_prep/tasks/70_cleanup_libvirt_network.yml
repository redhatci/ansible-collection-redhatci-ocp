---
- name: Check if SNO network exists
  block:
    - name: Does network exist
      community.libvirt.virt_net:
        name: "{{ network['name'] }}"
        command: status
      register: _snp_net_status
      become: true
      tags:
        - cleanup

    - name: Record that the SNO network exists
      ansible.builtin.set_fact:
        snp_network_exists: true
      tags:
        - cleanup
  rescue:
    - name: Record that the SNO network is absent
      ansible.builtin.set_fact:
        snp_network_exists: false
      tags:
        - cleanup

- name: Stop SNO network
  community.libvirt.virt_net:
    command: destroy
    name: "{{ network['name'] }}"
  become: true
  when:
    - snp_network_exists | bool
  tags:
    - cleanup

- name: Undefine SNO network
  community.libvirt.virt_net:
    command: undefine
    name: "{{ network['name'] }}"
  become: true
  when:
    - snp_network_exists | bool
  tags:
    - cleanup
...
