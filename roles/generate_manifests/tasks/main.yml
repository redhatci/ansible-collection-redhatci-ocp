- name: Render nmstate
  ansible.builtin.include_tasks: static.yml
  loop: "{{ groups['nodes'] }}"

- name: Make cluster-manifests dir
  ansible.builtin.file:
    name: "{{ manifests_dir }}"
    state: absent
  failed_when: false

- name: Make cluster-manifests dir
  ansible.builtin.file:
    name: "{{ cluster_manifest_dir }}"
    mode: "0775"
    recurse: true
    state: directory

- name: Update pull_secret variable
  ansible.builtin.set_fact:
    local_pull_secret: "{{ pull_secret | combine({
        'auths': pull_secret['auths'] | combine({
            'registry.ci.openshift.org': {
              'auth': pull_secret['auths'][mirror_registry]['auth'],
            }
          })
        })
      }}"
  when: use_local_mirror_registry  | bool
  no_log: true

- name: Initialize additional trust bundle file contents
  ansible.builtin.set_fact:
    _gm_file_certs: []

- name: Load additional trust bundle files
  when: gm_additional_trust_bundle_files | length > 0
  block:
    - name: Slurp additional trust bundle files
      ansible.builtin.slurp:
        src: "{{ trust_bundle_file }}"
      loop: "{{ gm_additional_trust_bundle_files }}"
      loop_control:
        loop_var: trust_bundle_file
      register: _gm_trust_bundle_files

    - name: Decode additional trust bundle files
      ansible.builtin.set_fact:
        _gm_file_certs: "{{ _gm_trust_bundle_files.results | map(attribute='content') | map('b64decode') | list }}"

- name: Assemble additionalTrustBundle content
  ansible.builtin.set_fact:
    gm_trust_bundle: "{{ _gm_trust_parts | map('trim') | select('ne', '') | join('\n') }}"
  vars:
    _gm_mirror_certs: "{{ [mirror_certificate | default('')] if (use_local_mirror_registry | bool) else [] }}"
    _gm_inline_certs: "{{ [gm_additional_trust_bundle] if (gm_additional_trust_bundle | default('') | trim | length > 0) else [] }}"
    _gm_trust_parts: "{{ _gm_mirror_certs + _gm_inline_certs + _gm_file_certs }}"

- name: Render agent-config templates
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ manifests_dir }}/{{ item.rsplit('.', 1)[0] }}"
    mode: "0644"
    trim_blocks: true
    lstrip_blocks: true
  loop:
    - agent-config.yaml.j2
    - install-config.yaml.j2

# The agent-config files are eventually deleted after its usage, just
# save them in a safe place in case of needing to check them
- name: Save a backup of agent-config files
  ansible.builtin.fetch:
    src: "{{ manifests_dir }}/{{ item }}"
    dest: "{{ fetched_dest }}/{{ item }}"
    flat: true
  loop:
    - agent-config.yaml
    - install-config.yaml

- name: Create extra_manifest_dir dir
  ansible.builtin.file:
    name: "{{ extra_manifest_dir }}"
    mode: "0775"
    recurse: true
    state: directory
  when:
    - manifests | bool
    - manifest_templates is defined
    - manifest_templates | length >= 0

- name: Render extra_manifests
  ansible.builtin.include_tasks: manifest.yml
  loop: "{{ manifest_templates }}"
  when: manifests | bool
