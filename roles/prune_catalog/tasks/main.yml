---
- name: "Validate_ parameters"
  ansible.builtin.assert:
    that:
      - pc_operators is defined
      - pc_operators | type_debug == "list" or
        pc_operators | type_debug == "dict"
      - pc_source_catalog is defined
      - pc_destination_catalog is defined
      - pc_source_catalog | length > 0
      - pc_destination_catalog | length > 0
    fail_msg: "At least one of the parameters requirements is missing"

- name: "Check if image is pullable - {{ pc_source_catalog }}"
  ansible.builtin.command: >
    skopeo inspect --no-tags
    {%- if pc_allow_insecure_registry | bool %}
    --tls-verify=false
    {%- endif %}
    {%- if lookup('ansible.builtin.env', 'DOCKER_CONFIG') | length %}
    --authfile "$DOCKER_CONFIG/config.json"
    {%- endif %}
    docker://{{ pc_source_catalog }}
  register: skopeo_result
  changed_when: skopeo_result.rc == 0
  retries: 3
  delay: 10
  until: skopeo_result.rc == 0
  failed_when:
    - skopeo_result.rc != 0
    - not pc_ignore_pull_errors

- name: "Prune catalog"
  when: skopeo_result.rc == 0
  block:
    - name: Create temporary directory
      ansible.builtin.tempfile:
        state: directory
        prefix: pc_tmp_dir.
      register: pc_tmp_dir

    - name: "Set working directory"
      ansible.builtin.set_fact:
        pc_tmp_dir: "{{ pc_tmp_dir.path }}"

    - name: "Download stable opm client"
      vars:
        pc_opm_rhel_url: >-
          https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/stable/opm-linux-rhel{{ ansible_distribution_major_version }}.tar.gz
        pc_opm_generic_url: >-
          https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/stable/opm-linux.tar.gz
      block:
        - name: "Check whether the RHEL-specific opm client is published"
          ansible.builtin.uri:
            url: "{{ pc_opm_rhel_url }}"
            method: HEAD
            status_code: [200, 404]
          register: _pc_opm_rhel
          retries: 3
          delay: 10
          until: _pc_opm_rhel.status | default(0) in [200, 404]

        - name: "Download stable opm client"
          vars:
            pc_opm_url: >-
              {{
                (_pc_opm_rhel.status | int == 200)
                | ternary(pc_opm_rhel_url, pc_opm_generic_url)
              }}
          ansible.builtin.unarchive:
            src: "{{ pc_opm_url }}"
            dest: "{{ pc_tmp_dir }}"
            remote_src: true
            mode: "0755"
          register: _pc_opm_download
          retries: 3
          delay: 10
          until: _pc_opm_download is not failed

    - name: "Find the extracted opm binary"
      ansible.builtin.find:
        paths: "{{ pc_tmp_dir }}"
        patterns: "opm*"
        file_type: file
      register: _pc_opm_binaries

    - name: "Set opm cmd"
      ansible.builtin.set_fact:
        pc_opm_cmd: "{{ _pc_opm_binaries.files[0].path }} {{ pc_opm_args }}"

    - name: "Create index working directory"
      ansible.builtin.file:
        path: "{{ pc_tmp_dir }}/configs"
        state: directory
        mode: "0755"

    - name: "Render the source catalog"
      ansible.builtin.shell:
        chdir: "{{ pc_tmp_dir }}"
        cmd: >
          set -x;
          {{ pc_opm_cmd }} render {{ pc_source_catalog }} >
          index-packages
      register: prune_result
      changed_when: prune_result.rc == 0
      until: prune_result.rc == 0
      retries: 3
      delay: 10

    - name: "Record catalog render files"
      vars:
        extra_catalogs: >-
          {{ ((pc_operators | type_debug == "dict") | ternary(pc_operators, {})) |
             dict2items |
             selectattr('value.catalog', 'defined') |
             map(attribute='value.catalog') |
             list | unique |
             difference([pc_source_catalog])
          }}
      block:
        - name: "Record the source catalog render file"
          ansible.builtin.set_fact:
            pc_catalog_files: "{{ {pc_source_catalog: pc_tmp_dir + '/index-packages'} }}"
            pc_extra_catalogs: "{{ extra_catalogs }}"

        - name: "Record each additional catalog render file"
          ansible.builtin.set_fact:
            pc_catalog_files: >-
              {{ pc_catalog_files | combine({
                   item: pc_tmp_dir + '/index-' + (item | regex_replace('[^A-Za-z0-9._-]', '_'))
                 }) }}
          loop: "{{ pc_extra_catalogs }}"
          when: pc_extra_catalogs | length > 0

    - name: "Render additional catalogs"
      ansible.builtin.shell:
        chdir: "{{ pc_tmp_dir }}"
        cmd: >
          set -x;
          {{ pc_opm_cmd }} render {{ catalog }} >
          {{ pc_catalog_files[catalog] }}
      loop: "{{ pc_extra_catalogs }}"
      loop_control:
        loop_var: catalog
      register: _pc_render_additional
      changed_when: _pc_render_additional.rc == 0
      until: _pc_render_additional.rc == 0
      retries: 3
      delay: 10
      when:
        - pc_extra_catalogs | length > 0

    - name: "Extract the listed channels for each operator"
      when: pc_operators | type_debug == "dict"
      block:
        - name: "Extract the listed channels for each operator"
          ansible.builtin.include_tasks:
            file: extract-channel.yml

    - name: "Extract the listed operators"
      when: pc_operators | type_debug == "list"
      block:
        - name: "Extract the listed operators"
          ansible.builtin.include_tasks:
            file: extract-operators.yml

    - name: "Copy configs.Dockerfile to temp directory"
      ansible.builtin.copy:
        content: |
          FROM quay.io/operator-framework/opm:latest
          ENTRYPOINT ["/bin/opm"]
          CMD ["serve", "/configs"]
          ADD configs /configs
          LABEL operators.operatorframework.io.index.configs.v1=/configs
          LABEL maintainer={{ pc_maintainer }} {% if pc_expire %} quay.expires-after={{ pc_expire_time }}{% endif %}
        dest: "{{ pc_tmp_dir }}/configs.Dockerfile"
        mode: "0644"

    - name: "Validate_ the pruned index"
      ansible.builtin.shell: |
        {{ pc_opm_cmd }} validate configs/
      args:
        chdir: "{{ pc_tmp_dir }}"
      register: validate_result
      changed_when: validate_result.rc == 0

    - name: "Build the index image"
      ansible.builtin.shell:
        chdir: "{{ pc_tmp_dir }}"
        cmd: >
          set -x;
          podman build
          --no-cache
          -t {{ pc_destination_catalog }}
          -f {{ pc_tmp_dir }}/configs.Dockerfile .
      register: build_result
      changed_when: build_result.rc == 0

    - name: "Pruned image"
      ansible.builtin.debug:
        msg: "Catalog image build as {{ pc_destination_catalog }}"
  always:
    - name: "Delete temp directory"
      ansible.builtin.file:
        state: absent
        path: "{{ pc_tmp_dir }}"
...
