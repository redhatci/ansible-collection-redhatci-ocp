---
- name: Create temporary directory for tooling
  ansible.builtin.tempfile:
    state: directory
    prefix: om_tmp.
  register: _om_tmp_dir

- name: Set permissions on temporary directory
  ansible.builtin.file:
    path: "{{ _om_tmp_dir.path }}"
    mode: "0700"

- name: Get ClusterVersion for client downloads
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: ClusterVersion
    name: version
  register: _om_cluster_version
  failed_when: false

- name: Download OCP clients
  vars:
    _om_ver_query: "history[?state=='Completed'] | [0].version"
    _om_cv_status: "{{ (_om_cluster_version.resources | default([]) | first | default({})).status | default({}) }}"
    _om_ocp_version: "{{ _om_cv_status | json_query(_om_ver_query) | default('', true) }}"
    _om_ocp_major: "{{ (_om_ocp_version | default('4', true)).split('.')[0] }}"
  block:
    - name: Extract latest oc-mirror
      vars:
        tarball_name: "oc-mirror{{ ansible_distribution_major_version is version('9', '==') | ternary('.rhel9', '') }}.tar.gz"
      ansible.builtin.unarchive:
        src: "https://mirror.openshift.com/pub/openshift-v{{ _om_ocp_major }}/x86_64/clients/ocp/latest/{{ tarball_name }}"
        dest: "{{ _om_tmp_dir.path }}"
        remote_src: true
        mode: "0755"
      register: _om_get_oc_mirror
      retries: 3
      delay: 60
      until: _om_get_oc_mirror is success

    - name: Download stable opm client
      vars:
        ocp_clients_url:
          "https://mirror.openshift.com/pub/openshift-v{{ _om_ocp_major }}/x86_64/clients/ocp/stable\
          /opm-linux{{ ansible_distribution_major_version is version('9', '==') | ternary('-rhel9', '') }}.tar.gz"
      ansible.builtin.unarchive:
        src: "{{ ocp_clients_url }}"
        dest: "{{ _om_tmp_dir.path }}"
        remote_src: true
        mode: "0755"
      register: _om_get_opm
      retries: 3
      delay: 10
      until: _om_get_opm is success

- name: Download jq binary
  ansible.builtin.get_url:
    url: "https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-linux-amd64"
    dest: "{{ _om_tmp_dir.path }}/jq"
    mode: "0755"
  register: _om_get_jq
  retries: 3
  delay: 60
  until: _om_get_jq is success
