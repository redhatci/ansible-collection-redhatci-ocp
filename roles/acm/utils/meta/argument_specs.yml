---
argument_specs:
  get-credentials:
    short_description: Get credentials for the Spoke/Managed Cluster
    description: >
      Obtain the kubeconfig and kubeadmin credentials for the Spoke/Managed Cluster
    options:
      utils_cluster_name:
        type: str
        required: true
        description: The name of the Spoke/Managed Cluster
      utils_cluster_namespace:
        type: str
        required: true
        description: The namespace of the Spoke/Managed Cluster
  monitor-install:
    short_description: Monitor the installation of the Spoke Cluster
    description: >
      Monitor the installation of the Spoke Cluster tracking the progress in the AgentClusterInstall CR
    options:
      utils_cluster_name:
        type: str
        required: true
        description: The name of the Spoke Cluster
      utils_cluster_namespace:
        type: str
        required: true
        description: The namespace of the Spoke Cluster
      utils_monitor_timeout:
        type: int
        required: false
        default: 90
        description: >
          Timeout in minutes for the installation process. Default is 90 minutes.
      utils_monitor_wait_time:
        type: int
        required: false
        default: 3
        description: >
          Wait time in minutes between each progress check. Default is 3 minutes.
  image-sources:
    short_description: Convert image mirror entries to registries.conf format
    description: >
      Merge a list of image mirror entries (source + mirrors) and convert them to the
      registries.conf format used by Assisted Service / ACM spokes in disconnected mode.
    options:
      utils_image_mirrors:
        type: list
        required: true
        elements: dict
        description: |
          List of image mirror entries to merge. Duplicate sources have their mirrors
          combined and deduplicated. The format is:
          - source: quay.io/path/to/image
            mirrors:
              - my.local.registry/path/to/image
      utils_unqualified_search_registries:
        type: list
        required: false
        default: ['registry.redhat.io', 'docker.io']
        elements: str
        description: >
          List of unqualified search registries. Default is ['registry.redhat.io', 'docker.io']
  disconnect-agent:
    short_description: Config Assisted Service Agent for disconnected mode
    description: >
      Configure the Assisted Service Agent for disconnected mode. This includes creating a ConfigMap with the
      registries.conf and ca-bundle.crt files, and patching the AgentServiceConfig with the config map.
    options:
      utils_registries:
        type: str
        required: true
        description: >
          The registries.conf format to use by the Assisted Images service to connect to the custom registry.
          This is generated by the `image-sources` module.
      utils_ca_bundle:
        type: str
        required: false
        default: ''
        description: >
          The CA bundle to use by the Assisted Images service to connect to the custom registry.
      utils_cm_name:
        type: str
        required: false
        default: mirror-registry
        description: >
          The name of the ConfigMap to create. Default is `mirror-registry`.
      utils_ocp_version:
        type: str
        required: true
        description: >
          The OpenShift version to use for the spoke cluster. This is used to determine the image versions.
      utils_iso_url:
        type: str
        required: true
        description: >
          The URL of the ISO image to use for the spoke cluster. This is used to determine the image versions.
      utils_root_fs_url:
        type: str
        required: true
        description: >
          The URL of the root filesystem image to use for the spoke cluster. This is used to determine the image versions.
  allow-ais-http-egress:
    short_description: Allow assisted-image-service egress to an OS image HTTP(S) URL
    description: >
      Create a NetworkPolicy that allows assisted-image-service pods to reach the port
      used by an OS image URL. Host IPs are resolved in-cluster via openshift-dns;
      egress is limited to those addresses (default /32 for IPv4 and /128 for IPv6),
      or to explicit CIDR blocks when set in utils_os_image_host_ips. Skipped unless
      the MultiClusterEngine CR has spec.networkPolicies.enabled set to true.
    options:
      utils_os_image_url:
        type: str
        required: true
        description: >
          URL of the OS/RHCOS image hosted for Assisted Service (e.g. http://webserver:8080/rhcos.iso).
      utils_os_image_host_ips:
        type: list
        required: false
        elements: str
        default: []
        description: >
          Optional list of IPv4/IPv6 addresses or CIDR blocks to allow in the NetworkPolicy
          (e.g. 192.0.2.10/32, 2600:12:1::10/128). When set, in-cluster DNS resolution
          is skipped. When empty, addresses are resolved via openshift-dns from the URL
          hostname and use /32 or /128 respectively.
  validate-policies:
    short_description: Validate ACM policies compliance
    description: >
      Validate that all ACM policies are compliant on the managed clusters. Fail if any enforced policy is non-compliant.
    options:
      utils_policy_retries:
        type: int
        required: false
        default: 30
        description: Number of retries to check for policy compliance. Default is 30.
      utils_policy_delay:
        type: int
        required: false
        default: 10
        description: Delay in seconds between each retry to check for policy compliance. Default is 10 seconds.
      utils_policy_namespace:
        type: str
        required: false
        description: The namespace where the ACM policies are deployed.
        default: default
      utils_policy_strict:
        type: bool
        required: false
        default: true
        description: >
          Whether to enforce strict compliance checking. If true, the module will fail if any policy is non-compliant.
          Default is true.
