---
# Allow assisted-image-service egress when MultiClusterEngine has networkPolicies enabled:
#   1. Same-namespace TCP 8090 to assisted-service (discovery.ign when serving ISOs).
#      MCE's default AIS policy only allows DNS, kube API 6443, and HTTPS 443.
#   2. HTTP(S) to the OS image URL port (e.g. http://host:8080/...).
#      Port comes from the URL, defaulting to 80 (http) or 443 (https).
#      Egress is allowed to all IPv4 (0.0.0.0/0) and IPv6 (::/0) ranges on that port.
#
# Required vars:
#   utils_os_image_url: URL of the RHCOS live ISO (or other OS image) hosted for Assisted Service

- name: "Validate OS image URL for AIS HTTP egress"
  ansible.builtin.assert:
    that:
      - utils_os_image_url is defined
      - utils_os_image_url | length > 0
      - (utils_os_image_url | urlsplit).scheme in ['http', 'https']
    fail_msg: >-
      utils_os_image_url must be a non-empty http or https URL
      (got '{{ utils_os_image_url | default('') }}').

- name: "Get MultiClusterEngine"
  kubernetes.core.k8s_info:
    api_version: multicluster.openshift.io/v1
    kind: MultiClusterEngine
  register: _utils_mce
  failed_when: false

# The following block can be removed if the enforcement of NetworkPolicies
# is abandoned in the future ACM-5 releases. See: ACM-42573
- name: "Create NetworkPolicies when MCE networkPolicies are enabled"
  when:
    - (_utils_mce.resources | default([]) | length) > 0
    - ((_utils_mce.resources | first).spec | default({})).networkPolicies is defined
    - ((_utils_mce.resources | first).spec.networkPolicies.enabled | default(false)) | bool
  vars:
    _utils_img_parts: "{{ utils_os_image_url | urlsplit }}"
    _utils_port: "{{ _utils_img_parts.port | default((_utils_img_parts.scheme == 'https') | ternary(443, 80), true) | int }}"
  block:
    - name: "Create NetworkPolicy for assisted-image-service to assisted-service"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: assisted-image-service-allow-assisted-service
            namespace: multicluster-engine
            labels:
              app: assisted-image-service
          spec:
            podSelector:
              matchLabels:
                app: assisted-image-service
            policyTypes:
              - Egress
            egress:
              - to:
                  - podSelector:
                      matchLabels:
                        app: assisted-service
                ports:
                  - protocol: TCP
                    port: 8090

    - name: "Create NetworkPolicy for assisted-service registry egress"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: assisted-service-registry
            namespace: multicluster-engine
            labels:
              app: assisted-service
          spec:
            podSelector:
              matchLabels:
                app: assisted-service
            policyTypes:
              - Egress
            egress:
              - to:
                  - ipBlock:
                      cidr: 0.0.0.0/0
                  - ipBlock:
                      cidr: ::/0
                ports:
                  - protocol: TCP
                    port: 4443

    - name: "Create NetworkPolicy for assisted-image-service OS image HTTP egress"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: "assisted-image-service-allow-http-{{ _utils_port }}"
            namespace: multicluster-engine
            labels:
              app: assisted-image-service
          spec:
            podSelector:
              matchLabels:
                app: assisted-image-service
            policyTypes:
              - Egress
            egress:
              - to:
                  - ipBlock:
                      cidr: 0.0.0.0/0
                  - ipBlock:
                      cidr: ::/0
                ports: "{{ [{'protocol': 'TCP', 'port': _utils_port | int}] }}"
