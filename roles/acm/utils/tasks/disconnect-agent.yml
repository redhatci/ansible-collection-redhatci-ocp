---
- name: Set config map with mirror registries, and CA bundle
  vars:
    cm_data: >-
      {{
        {'registries.conf': utils_registries}
        | combine(
            {'ca-bundle.crt': utils_ca_bundle}
            if (utils_ca_bundle | length > 0)
            else {}
          )
      }}
  kubernetes.core.k8s:
    state: present
    force: true
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ utils_cm_name }}"
        namespace: multicluster-engine
        labels:
          app: assisted-service
      data: "{{ cm_data }}"
    namespace: multicluster-engine

- name: Check the AgentServiceConfig instance
  kubernetes.core.k8s_info:
    api_version: agent-install.openshift.io/v1beta1
    kind: AgentServiceConfig
    name: agent
    namespace: multicluster-engine
  register: asg

- name: Allow assisted-image-service egress to OS image webserver
  ansible.builtin.include_tasks: allow-ais-http-egress.yml
  vars:
    utils_os_image_url: "{{ utils_iso_url }}"

- name: Patch the Agent Service Config
  vars:
    os_images:
      openshiftVersion: "{{ utils_ocp_version }}"
      version: "{{ utils_ocp_version.split('.')[:2] | join('.') }}"
      url: "{{ utils_iso_url }}"
      rootFSUrl: "{{ utils_root_fs_url }}"
      cpuArchitecture: x86_64
    as_def:
      apiVersion: agent-install.openshift.io/v1beta1
      kind: AgentServiceConfig
      metadata:
        name: agent
        namespace: multicluster-engine
      spec:
        osImages: "{{ (asg.resources[0].spec.osImages | default([])) + [os_images] }}"
        mirrorRegistryRef:
          name: "{{ utils_cm_name }}"
  kubernetes.core.k8s:
    state: present
    definition: "{{ as_def }}"
  when:
    - asg.resources | length == 1

- name: Wait for assisted-image-service pods to be Running
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    label_selectors:
      - "app=assisted-image-service"
    namespace: multicluster-engine
  register: pod_list
  until:
    - pod_list.resources | length > 0
    - >
      pod_list.resources
      | json_query('[?status.conditions[?type==`Ready` && status==`True`]]')
      | length == pod_list.resources | length
  retries: 20
  delay: 15
  no_log: true

- name: Wait for assisted-service to be Running
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    label_selectors:
      - "app=assisted-service"
    namespace: multicluster-engine
  register: pod_list
  until:
    - pod_list.resources | length > 0
    - >
      pod_list.resources
      | json_query('[?status.conditions[?type==`Ready` && status==`True`]]')
      | length == pod_list.resources | length
  retries: 20
  delay: 15
  no_log: true

- name: Validate the Service config volumes binding
  kubernetes.core.k8s_info:
    api_version: v1
    kind: PersistentVolumeClaim
    namespace: multicluster-engine
  register: volumes_list
  until: volumes_list | json_query('resources[*].status.phase') | unique == ["Bound"]
  retries: 20
  delay: 15
