---
- name: Retrieve branch name
  ansible.builtin.command:
    cmd: >
      git branch --show-current
    chdir: "{{ preflight_source_dir }}"
  register: preflight_branch_name

- name: Set preflight_branch
  ansible.builtin.set_fact:
    preflight_branch: "{{ preflight_branch_name.stdout }}"

- name: Copy read-only source folder to set 0755 mode
  ansible.builtin.copy:
    src: "{{ preflight_source_dir }}/"
    dest: "{{ preflight_tmp_dir.path }}/preflight-source/"
    mode: "0755"

- name: Set preflight_image name # noqa: jinja[spacing]
  vars:
    preflight_fqar: >-
      {%- if dci_local_registry | length > 0 -%}
      {{ dci_local_registry }}/preflight/preflight:{{ preflight_branch }}
      {%- else -%}
      localhost/preflight/preflight:{{ preflight_branch }}
      {%- endif -%}
  ansible.builtin.set_fact:
    preflight_image: "{{ preflight_fqar }}"

- name: "Append to image name the job id"
  ansible.builtin.set_fact:
    preflight_image: "{{ preflight_image + '-' + job_id }}"
  when: job_id is defined

# Preflight reports its build version to Pyxis as part of the test results, so
# build from the newest Preflight version registered in Pyxis.
- name: Get the newest Preflight version enabled for testing in Pyxis
  vars:
    # Pyxis stores tool names without the URL scheme.
    _preflight_pyxis_tool_name: "{{ preflight_repo_https | regex_replace('^https?://', '') }}"
    # Only versions enabled for testing can be submitted with test results.
    _preflight_pyxis_filter: "name=={{ _preflight_pyxis_tool_name }};enabled_for_testing==true"
  ansible.builtin.uri:
    # Pyxis sorts versions as semver, so the first entry is the newest one.
    url: "{{ catalog_url }}/tools?page_size=1&sort_by=version[desc]&filter={{ _preflight_pyxis_filter }}"
    method: GET
  register: _preflight_pyxis_tools

- name: Set Preflight release tag to the newest version available in Pyxis
  ansible.builtin.set_fact:
    preflight_release_tag: "{{ _preflight_pyxis_tools.json.data | map(attribute='version') | first | default('') }}"

- name: Fail when no Preflight version is enabled for testing in Pyxis
  ansible.builtin.fail:
    msg: >-
      Unable to find a Preflight version enabled for testing in Pyxis at
      {{ catalog_url }}/tools. Refusing to build the image, because Pyxis
      rejects test results submitted from versions it has not enabled.
  when: preflight_release_tag | default('') | length == 0

- name: Build Preflight image  # noqa: command-instead-of-shell
  vars:
    push_image: >-
      && podman push
      --authfile {{ partner_creds }}
      {{ preflight_image }}
  ansible.builtin.shell:
    cmd: >-
      podman build .
      --no-cache
      --pull=always
      --retry 3
      -t {{ preflight_image }}
      --build-arg=release_tag={{ preflight_release_tag }}
      {{ (dci_local_registry | length > 0) | ternary(push_image, "") }}
    chdir: "{{ preflight_tmp_dir.path }}/preflight-source"
  register: _preflight_build
  retries: 3
  delay: 15
  until: _preflight_build is succeeded
  notify:
    - "Remove the local preflight image"

- name: Display Preflight version to ensure that the image build went fine
  ansible.builtin.command: >
    podman run --rm {{ preflight_image }} --version
...
