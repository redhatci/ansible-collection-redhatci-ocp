---
# generate_seed_image role default variables
#
# Required variables (no defaults, see meta/argument_specs.yml):
#   gsi_hub_kubeconfig, gsi_seed_tag, gsi_site, gsi_gitops_repo,
#   gsi_gitops_branch, gsi_gitops_clusterinstance_file
#
# The seed cluster is the one selected by the KUBECONFIG environment variable.

# Path to the oc binary (used to request a registry token on the hub).
gsi_oc_path: /usr/local/bin/oc

# Directory where the seed generation timing report is written. Leave empty to
# skip the report (e.g. set to job_logs.path in DCI).
gsi_output_dir: ""

# --- Operators on the seed cluster ----------------------------------------
# Install OADP and the Lifecycle Agent with redhatci.ocp.olm_operator. When
# false the role only checks they are installed.
gsi_install_operators: false
gsi_operators_source: redhat-operators
gsi_operators_source_ns: openshift-marketplace
gsi_oadp_namespace: openshift-adp
# Empty lets redhatci.ocp.olm_operator use the operator's default channel
# (PackageManifest status.defaultChannel), so it tracks the catalog instead of
# pinning a version that goes stale. Set explicitly to override.
gsi_oadp_channel: ""
gsi_lca_namespace: openshift-lifecycle-agent
gsi_lca_channel: stable

# --- Hub image registry ---------------------------------------------------
# Storage for the hub image registry PVC. Only used when the PVC does not
# exist yet, and only when no external seed registry is configured.
gsi_registry_storage_class: ocs-storagecluster-cephfs
gsi_registry_storage_size: 100Gi

# --- Seed image registry --------------------------------------------------
# Registry the seed image is pushed to. When gsi_seed_registry is set the seed
# image goes to that external registry and the hub's internal registry is left
# untouched (no default route, no PVC, no push service account). It is empty by
# default, meaning "use the hub registry"; set it, or provide a registry_host
# inventory group, to push to an external registry both the seed and target
# clusters can reach.
gsi_seed_registry: >-
  {{ (groups['registry_host'][0] ~ ':' ~ (registry_port | default(5000)))
     if (groups['registry_host'] | default([]) | length > 0) else '' }}
# File with the external registry credentials. Reuse the pull secret the
# mirror_images role already uses (pullsecret_file / dci_pullsecret_file), then
# fall back to the registry_host disconnected_registry_auths_file. Both a full
# pull secret ({"auths": ...}) and a plain registry -> auth map are accepted.
# The push is anonymous when there is no entry for the registry.
gsi_seed_registry_authfile: >-
  {{ pullsecret_file
     | default(dci_pullsecret_file
       | default(disconnected_registry_auths_file | default(''))) }}
# Add the registry to the seed cluster insecureRegistries. Only needed when the
# registry uses a self-signed certificate or plain HTTP; leave false for a
# registry the seed cluster already trusts.
gsi_seed_registry_insecure: false

# --- Waits ----------------------------------------------------------------
# Hub ManagedCluster removal and seed cluster agent cleanup.
gsi_detach_retries: 40
gsi_detach_delay: 15
# Seed cluster MachineConfigPool update after trusting the hub registry.
gsi_mcp_retries: 40
gsi_mcp_delay: 15
# Seed image build (default 120 x 15s = 30 minutes), then seed cluster restore.
gsi_seed_retries: 120
gsi_seed_delay: 15
...
