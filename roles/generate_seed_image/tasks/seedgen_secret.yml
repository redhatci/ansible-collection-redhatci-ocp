---
# LCA reads the hub registry push credentials from the seedgen Secret.

- name: Create a token for the registry push service account
  ansible.builtin.command:
    argv:
      - "{{ gsi_oc_path }}"
      - --kubeconfig
      - "{{ gsi_hub_kubeconfig }}"
      - create
      - token
      - registry-user
      - --namespace
      - openshift
  register: _gsi_registry_token
  changed_when: false
  no_log: true

- name: Create the seedgen Secret on the seed cluster
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: seedgen
        namespace: "{{ gsi_lca_namespace }}"
      data:
        seedAuth: >-
          {{ {'auths': {gsi_hub_registry: {'auth': ('registry-user:' ~ _gsi_registry_token.stdout) | b64encode}}}
             | to_json | b64encode }}
  no_log: true
...
