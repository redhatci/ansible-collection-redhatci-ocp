---
# LCA reads the seed image registry push credentials from the seedgen Secret.

# Hub registry: create a token for the push service account created by
# hub_registry.yml.
- name: Set the hub registry push auth
  when: gsi_seed_registry | length == 0
  block:
    - name: Create a token for the hub registry push service account
      ansible.builtin.command:
        argv:
          - "{{ gsi_oc_path }}"
          - --kubeconfig
          - "{{ gsi_hub_kubeconfig }}"
          - create
          - token
          - registry-user
          - --namespace
          - openshift
      register: _gsi_registry_token
      changed_when: false
      no_log: true

    - name: Set the hub registry push auth
      ansible.builtin.set_fact:
        gsi_seed_auths: >-
          {{ {'auths': {gsi_hub_registry: {'auth': ('registry-user:' ~ _gsi_registry_token.stdout) | b64encode}}} }}

# External registry: reuse the pull secret / authfile.
# The push is anonymous if it has no entry for the registry.
- name: Set the external registry push auth
  when: gsi_seed_registry | length > 0
  block:
    - name: Read the external registry authfile
      ansible.builtin.slurp:
        src: "{{ gsi_seed_registry_authfile }}"
      delegate_to: localhost
      register: _gsi_registry_authfile
      no_log: true

    - name: Set the external registry push auth
      vars:
        _gsi_registry_auth_entry: >-
          {{ (((_gsi_registry_authfile.content | b64decode | from_json).auths)
              if ((_gsi_registry_authfile.content | b64decode | from_json).auths is defined)
              else (_gsi_registry_authfile.content | b64decode | from_json))[gsi_seed_image_registry] | default({}, true) }}
      ansible.builtin.set_fact:
        gsi_seed_auths: >-
          {{ {'auths': {gsi_seed_image_registry: _gsi_registry_auth_entry}}
             if _gsi_registry_auth_entry | length > 0 else {'auths': {}} }}
      no_log: true

- name: Create the seedgen Secret on the seed cluster
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: seedgen
        namespace: "{{ gsi_lca_namespace }}"
      data:
        seedAuth: "{{ gsi_seed_auths | to_json | b64encode }}"
  no_log: true
...
