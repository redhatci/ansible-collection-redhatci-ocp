---
# Add the hub registry to the seed cluster insecureRegistries so LCA can push
# the seed image. MCO applies this in place (no reboot on OCP 4.14+).

- name: Get the seed cluster image configuration
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: Image
    name: cluster
  register: _gsi_image_config

- name: Set the current insecure registries
  ansible.builtin.set_fact:
    gsi_insecure_registries: >-
      {{ _gsi_image_config.resources[0].spec.registrySources.insecureRegistries | default([]) }}

- name: Add the hub registry to insecureRegistries
  when: gsi_hub_registry not in gsi_insecure_registries
  block:
    - name: Get the master MachineConfigPool
      kubernetes.core.k8s_info:
        api_version: machineconfiguration.openshift.io/v1
        kind: MachineConfigPool
        name: master
      register: _gsi_mcp

    - name: Record the current rendered MachineConfig
      ansible.builtin.set_fact:
        gsi_rendered_mc: "{{ _gsi_mcp.resources[0].spec.configuration.name }}"

    - name: Patch the image configuration
      kubernetes.core.k8s:
        state: patched
        merge_type: merge
        definition:
          apiVersion: config.openshift.io/v1
          kind: Image
          metadata:
            name: cluster
          spec:
            registrySources:
              insecureRegistries: "{{ gsi_insecure_registries + [gsi_hub_registry] }}"

    - name: Wait for the new MachineConfig to be rendered
      kubernetes.core.k8s_info:
        api_version: machineconfiguration.openshift.io/v1
        kind: MachineConfigPool
        name: master
      register: _gsi_mcp
      until: _gsi_mcp.resources[0].spec.configuration.name != gsi_rendered_mc
      retries: 20
      delay: 15

    - name: Wait for the MachineConfigPool to be updated
      kubernetes.core.k8s_info:
        api_version: machineconfiguration.openshift.io/v1
        kind: MachineConfigPool
        name: master
      register: _gsi_mcp
      until:
        - _gsi_mcp.resources[0].status.configuration.name == _gsi_mcp.resources[0].spec.configuration.name
        - >-
          _gsi_mcp.resources[0].status.conditions | default([])
          | selectattr('type', 'equalto', 'Updated')
          | map(attribute='status') | first | default('False') == 'True'
      retries: "{{ gsi_mcp_retries }}"
      delay: "{{ gsi_mcp_delay }}"
...
