---
ac_server_api: https://kubernetes.default.svc
ac_namespace: openshift-gitops
ac_app_dir_recurse: false
ac_hide_secrets: true
ac_cluster_role: "openshift-gitops-{{ ac_namespace }}-argocd-application-controller"
ac_permissions_def:
  apiVersion: rbac.authorization.k8s.io/v1
  kind: ClusterRoleBinding
  metadata:
    name: gitops-cluster
  roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: "{{ ac_cluster_role }}"
  subjects:
    - kind: ServiceAccount
      name: openshift-gitops-argocd-application-controller
      namespace: "{{ ac_namespace }}"
ac_project: project
ac_project_def:
  apiVersion: argoproj.io/v1alpha1
  kind: AppProject
  metadata:
    name: "{{ ac_project }}"
    namespace: "{{ ac_namespace }}"
  spec:
    clusterResourceWhitelist:
      - group: ''
        kind: Namespace
    namespaceResourceWhitelist:
      - group: '*'
        kind: '*'
    destinations:
      - namespace: "{{ ac_app_namespace }}"
        server: "{{ ac_server_api }}"
    sourceRepos:
      - "{{ ac_repo }}"
ac_repo_revision: main
ac_ssh_port: 22
ac_wait_retries: 30
ac_wait_delay: 10
