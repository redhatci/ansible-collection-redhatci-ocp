---
# LCA reads the seed image pull credentials from the LCA pull Secret. A token is
# created for the hub registry-user service account, or the credentials are
# taken from the external registry authfile. The pull is anonymous when the
# authfile has no entry for the registry.

- name: Set the hub registry pull auth
  when: ibu_seed_registry | length == 0
  block:
    - name: Create a token for the hub registry user
      ansible.builtin.command:
        argv:
          - "{{ ibu_oc_path }}"
          - --kubeconfig
          - "{{ ibu_hub_kubeconfig }}"
          - create
          - token
          - "{{ ibu_registry_user }}"
          - --namespace
          - "{{ ibu_registry_user_namespace }}"
      register: _ibu_registry_token
      changed_when: false
      no_log: true

    - name: Set the hub registry pull auth
      ansible.builtin.set_fact:
        ibu_lca_dockerconfigjson: >-
          {{ {'auths': {ibu_hub_registry:
             {'auth': (ibu_registry_user ~ ':' ~ _ibu_registry_token.stdout) | b64encode}}} }}
      no_log: true

- name: Set the external registry pull auth
  when: ibu_seed_registry | length > 0
  block:
    - name: Read the external registry authfile
      when: ibu_seed_registry_authfile | length > 0
      ansible.builtin.slurp:
        src: "{{ ibu_seed_registry_authfile }}"
      delegate_to: localhost
      register: _ibu_registry_authfile
      no_log: true

    - name: Set the external registry pull auth
      vars:
        _ibu_authfile_json: >-
          {{ (_ibu_registry_authfile.content | b64decode | from_json)
             if (_ibu_registry_authfile.content | default('') | length > 0) else {} }}
        _ibu_auths: "{{ _ibu_authfile_json.auths | default(_ibu_authfile_json) }}"
        _ibu_registry_entry: "{{ _ibu_auths[ibu_seed_image_registry] | default({}, true) }}"
      ansible.builtin.set_fact:
        ibu_lca_dockerconfigjson: >-
          {{ {'auths': {ibu_seed_image_registry: _ibu_registry_entry}}
             if _ibu_registry_entry | length > 0 else {'auths': {}} }}
      no_log: true

- name: Delete any previous LCA pull Secret
  kubernetes.core.k8s:
    kubeconfig: "{{ ibu_sno_kubeconfig }}"
    state: absent
    api_version: v1
    kind: Secret
    name: "{{ ibu_lca_pull_secret_name }}"
    namespace: "{{ ibu_lca_namespace }}"

- name: Create the LCA pull Secret
  kubernetes.core.k8s:
    kubeconfig: "{{ ibu_sno_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      type: kubernetes.io/dockerconfigjson
      metadata:
        name: "{{ ibu_lca_pull_secret_name }}"
        namespace: "{{ ibu_lca_namespace }}"
      data:
        .dockerconfigjson: "{{ ibu_lca_dockerconfigjson | to_json | b64encode }}"
  no_log: true
...
