---
- name: Create OpenShift Manifest
  ansible.builtin.shell: |
    /usr/local/bin/{{ installer_cmd }} --dir {{ dir }} create manifests
  tags: manifests

- name: Ensure the manifests dir is owned by {{ ansible_user }}
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    recurse: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  with_items:
    - "{{ dir }}/openshift"
    - "{{ dir }}/manifests"
  tags: manifests

- name: Copy the metal3-config.yaml to openshift directory
  ansible.builtin.copy:
    src: "{{ dir }}/metal3-config.yaml"
    dest: "{{ dir }}/openshift/98_metal3-config.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
    remote_src: true
  when: release_version is ansible.builtin.version('4.3', '<=')
  tags: manifests

# In OCP 5.x the install-config only accepts a single SSH key, so any extra keys
# listed in ssh_extra_keys_paths are injected at day 1 through the SSH
# MachineConfig manifests generated by the installer.
- name: Inject extra SSH keys into the SSH MachineConfig manifests
  when:
    - release_version is ansible.builtin.version('5.0', '>=')
    - ssh_extra_keys_paths is defined
    - ssh_extra_keys_paths | length > 0
  tags: manifests
  block:
    - name: Load the content of the extra SSH keys
      ansible.builtin.set_fact:
        installer_extra_ssh_keys: "{{ installer_extra_ssh_keys | default([]) + [lookup('file', item | regex_replace('~', lookup('env', 'HOME'))) | trim] }}"
      loop: "{{ ssh_extra_keys_paths }}"
      no_log: true

    - name: Check if the SSH MachineConfig manifests exist
      ansible.builtin.stat:
        path: "{{ dir }}/openshift/{{ item }}"
      register: _installer_ssh_machineconfigs
      loop:
        - 99_openshift-machineconfig_99-master-ssh.yaml
        - 99_openshift-machineconfig_99-worker-ssh.yaml

    - name: Build the extra SSH keys block to inject under sshAuthorizedKeys
      ansible.builtin.set_fact:
        installer_extra_ssh_keys_block: "{{ installer_extra_ssh_keys | map('to_json') | map('regex_replace', '^', '        - ') | join('\n') }}"
      no_log: true

    - name: Add the extra SSH keys under sshAuthorizedKeys
      ansible.builtin.blockinfile:
        path: "{{ item.stat.path }}"
        insertafter: '^        sshAuthorizedKeys:'
        marker: "        # {mark} extra SSH keys injected by the installer role"
        block: "{{ installer_extra_ssh_keys_block }}"
      loop: "{{ _installer_ssh_machineconfigs.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists
