---
# node_info role default variables

# Path to the oc tool binary
ni_oc_tool_path: "/usr/local/bin/oc"

# Job logs directory where output files will be saved
ni_job_logs_path: "/tmp/node-info-logs"

# Disconnected environment settings
ni_disconnected: false
ni_local_registry: ""
ni_pullsecret_file: ""
ni_tag: "latest"
ni_local_img_path: "/dci/lshw"

# BMC out-of-band firmware collection settings
# Set to true to enable Redfish BMC data collection
ni_collect_bmc: false
# Map of node_name -> BMC hostname/IP address for Redfish access
ni_bmc_address: {}
# BMC credentials (use vault or secrets management in production)
ni_bmc_username: ""
ni_bmc_password: ""
...
