---
# Resolve a single BareMetalHost into a BMC target (address + credentials).
# Expected loop var:
#   _ni_bmh - one BareMetalHost resource

- name: "Read BMC credentials secret for {{ _ni_bmh.metadata.name }}"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ _ni_bmh.spec.bmc.credentialsName }}"
    namespace: "{{ _ni_bmh.metadata.namespace }}"
    kubeconfig: "{{ ni_hub_kubeconfig | default(omit, true) }}"
  register: _ni_bmh_secret
  failed_when: false
  no_log: true

- name: "Register BMC target for {{ _ni_bmh.metadata.name }}"
  vars:
    # Node name as it appears in "oc get nodes": the assisted/ZTP hostname
    # annotation when present, otherwise the discovered or BareMetalHost name.
    _ni_node: >-
      {{ (_ni_bmh.metadata.annotations | default({}))['bmac.agent-install.openshift.io/hostname']
         | default(_ni_bmh.status.hardware.hostname | default(_ni_bmh.metadata.name)) }}
    # Strip the protocol scheme and any path to keep only host[:port]
    # (IPv6 brackets are preserved), e.g.
    # redfish-virtualmedia://[2600:12:129::140]/redfish/v1/Systems/1 -> [2600:12:129::140]
    _ni_host: "{{ _ni_bmh.spec.bmc.address.split('://')[-1].split('/')[0] }}"
    _ni_secret_data: "{{ _ni_bmh_secret.resources[0].data | default({}) }}"
  ansible.builtin.set_fact:
    ni_bmc_address: "{{ ni_bmc_address | combine({_ni_node: _ni_host}) }}"
    _ni_bmc_creds: >-
      {{
        _ni_bmc_creds | default({}) | combine({
          _ni_node: {
            'username': (_ni_secret_data.username | default('') | b64decode),
            'password': (_ni_secret_data.password | default('') | b64decode)
          }
        })
      }}
  when:
    - _ni_bmh_secret.resources is defined
    - (_ni_bmh_secret.resources | length) > 0
    - _ni_bmh_secret.resources[0].data is defined
  no_log: true
