---
# Collect BMC firmware information for a single node.
# Strategy:
#   1. When ni_bmc_from_bmh is true and the node has a matching
#      HostFirmwareComponents CRD entry, read currentVersion from the CRD
#      (preferred: no out-of-band access, no credentials needed).
#   2. Fall back to direct Redfish queries only when the CRD is unavailable
#      or carries no currentVersion for the bmc component.
#   3. When ni_bmc_from_bmh is false (manual addresses), skip the CRD path
#      entirely and use Redfish directly.
#
# Expected task vars (set by the caller loop):
#   node_name  - the OpenShift node name (used as dict key)
# Expected role vars:
#   ni_bmc_address    - dict mapping node_name -> BMC hostname/IP
#   ni_bmc_username   - Redfish username (fallback when no per-node credential)
#   ni_bmc_password   - Redfish password (fallback when no per-node credential)
#   ni_bmc_creds     - optional dict node_name -> {username, password} from
#                       BareMetalHost discovery; takes precedence when present
#   ni_bmc_disc_bmh_meta - dict node_name -> {name, namespace, systemVendor}
#                          from BareMetalHost discovery (used for CRD path)

- name: "Initialize CRD firmware lookup status for {{ node_name }}"
  ansible.builtin.set_fact:
    ni_crd_bmc_found: false
    ni_crd_bmc_version: ''

- name: "Attempt CRD-first BMC firmware lookup for {{ node_name }}"
  ansible.builtin.include_tasks: collect_bmc_from_crd.yml
  when:
    - ni_bmc_from_bmh | bool
    - node_name in (ni_bmc_disc_bmh_meta | default({}))

# Redfish fallback: only executed when the CRD path did not supply firmware data.
- name: "Collect BMC firmware via Redfish for {{ node_name }}"
  when: not (ni_crd_bmc_found | default(false) | bool)
  block:
    - name: "Set effective BMC credentials for {{ node_name }}"
      ansible.builtin.set_fact:
        ni_bmc_user: >-
          {{ (ni_bmc_creds | default({}))[node_name].username
             | default(ni_bmc_username) }}
        ni_bmc_pass: >-
          {{ (ni_bmc_creds | default({}))[node_name].password
             | default(ni_bmc_password) }}
      no_log: true

    - name: "Discover Redfish Managers endpoint"
      ansible.builtin.uri:
        url: >-
          {{ (ni_bmc_targets[node_name] if '://' in ni_bmc_targets[node_name]
              else 'https://' + ni_bmc_targets[node_name])
             + '/redfish/v1/Managers' }}
        method: GET
        user: "{{ ni_bmc_user }}"
        password: "{{ ni_bmc_pass }}"
        force_basic_auth: true
        validate_certs: "{{ ni_bmc_validate_certs }}"
        return_content: true
        status_code: [200]
      register: _ni_bmc_managers
      failed_when: false
      no_log: true

    - name: "Fetch first Redfish Manager details"
      ansible.builtin.uri:
        url: >-
          {{ _ni_bmc_managers.json['Members'][0]['@odata.id']
             if '://' in _ni_bmc_managers.json['Members'][0]['@odata.id']
             else (ni_bmc_targets[node_name] if '://' in ni_bmc_targets[node_name]
                   else 'https://' + ni_bmc_targets[node_name])
                  + _ni_bmc_managers.json['Members'][0]['@odata.id'] }}
        method: GET
        user: "{{ ni_bmc_user }}"
        password: "{{ ni_bmc_pass }}"
        force_basic_auth: true
        validate_certs: "{{ ni_bmc_validate_certs }}"
        return_content: true
        status_code: [200]
      register: _ni_bmc_detail
      failed_when: false
      no_log: true
      when:
        - _ni_bmc_managers is defined
        - _ni_bmc_managers.status is defined
        - _ni_bmc_managers.status == 200
        - _ni_bmc_managers.json is defined
        - _ni_bmc_managers.json['Members'] is defined
        - (_ni_bmc_managers.json['Members'] | length) > 0
        - _ni_bmc_managers.json['Members'][0]['@odata.id'] is defined

    - name: "Fetch Redfish root endpoint for {{ node_name }}"
      ansible.builtin.uri:
        url: >-
          {{ (ni_bmc_targets[node_name] if '://' in ni_bmc_targets[node_name]
              else 'https://' + ni_bmc_targets[node_name])
             + '/redfish/v1' }}
        method: GET
        user: "{{ ni_bmc_user }}"
        password: "{{ ni_bmc_pass }}"
        force_basic_auth: true
        validate_certs: "{{ ni_bmc_validate_certs }}"
        return_content: true
        status_code: [200]
      register: _ni_bmc_root
      failed_when: false
      no_log: true

    - name: "Store BMC firmware data for {{ node_name }}"
      ansible.builtin.set_fact:
        ni_bmc_data: >-
          {{
            ni_bmc_data | combine({
              node_name: {
                'vendor': (
                  (_ni_bmc_detail.json.Manufacturer | default(''))
                  or (_ni_bmc_root.json.Vendor | default(''))
                ) | regex_replace('(?i)\s*,?\s*inc\.?\s*$', ''),
                'version': _ni_bmc_detail.json.FirmwareVersion | default('')
              }
            })
          }}
      when:
        - _ni_bmc_detail is defined
        - _ni_bmc_detail.status is defined
        - _ni_bmc_detail.status == 200
        - _ni_bmc_detail.json is defined
        - _ni_bmc_detail.json.FirmwareVersion is defined
        - _ni_bmc_detail.json.FirmwareVersion | length > 0
...
