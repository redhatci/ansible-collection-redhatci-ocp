---
- name: Validate_ requirements
  ansible.builtin.include_tasks: validations.yml

- name: Create working directory
  ansible.builtin.tempfile:
    state: directory
    prefix: cluster_compare
  register: _cc_tmp_dir

- name: Set work directory path
  ansible.builtin.set_fact:
    cc_work_dir: "{{ _cc_tmp_dir.path }}"

- name: Install kube-compare tools
  ansible.builtin.include_tasks: install_tools.yml

- name: Generate a reference from the cluster
  ansible.builtin.include_tasks: generate.yml
  when: cc_mode == "generate"

- name: Compare the cluster against a reference
  ansible.builtin.include_tasks: upstream.yml
  when: cc_mode != "generate"

# - name: Test with downstream container images
#   ansible.builtin.include_tasks: containers.yml

- name: Remove working directory
  ansible.builtin.file:
    path: "{{ cc_work_dir }}"
    state: absent
...
