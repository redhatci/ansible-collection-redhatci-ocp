---
- name: Set the generate output directory
  ansible.builtin.set_fact:
    cc_generate_ref_dir: "{{ cc_generate_output_dir | default('', true) | ternary(cc_generate_output_dir, cc_reports_dir ~ '/reference') }}"

- name: Ensure the generate output directory exists
  ansible.builtin.file:
    path: "{{ cc_generate_ref_dir }}"
    state: directory
    mode: '0755'

- name: Template the generate-config when none was provided
  ansible.builtin.template:
    src: generate-config.yaml.j2
    dest: "{{ cc_work_dir }}/generate-config.yaml"
    mode: '0644'
  when: cc_generate_config | length == 0

- name: Check the kube-compare help output
  ansible.builtin.command: ./kubectl-cluster_compare --help
  args:
    chdir: "{{ cc_work_dir }}"
  register: _cc_help
  changed_when: false
  no_log: true

- name: Fail when the installed kube-compare does not support reference generation
  ansible.builtin.fail:
    msg: >-
      kube-compare {{ cc_version }} does not support '-g' (reference generation).
      Pin cc_version to v0.13.1 or newer.
  when:
    - "'-g,' not in _cc_help.stdout"
    - "'--generate' not in _cc_help.stdout"

- name: Generate the reference from the cluster
  vars:
    cc_generate_config_path: "{{ cc_generate_config if (cc_generate_config | length > 0) else (cc_work_dir ~ '/generate-config.yaml') }}"
  ansible.builtin.command:
    argv: "{{ ['./kubectl-cluster_compare', '-g', cc_generate_config_path, '--output-dir', cc_generate_ref_dir]
              + (['-f', cc_must_gather] if (cc_must_gather | length > 0) else []) }}"
    chdir: "{{ cc_work_dir }}"
  register: _cc_generate
  changed_when: true

- name: Show the generate output
  ansible.builtin.debug:
    var: _cc_generate.stdout_lines

- name: Find the generated reference files
  ansible.builtin.find:
    paths: "{{ cc_generate_ref_dir }}"
    recurse: true
  register: _cc_generated_files

- name: Report the generated reference location
  ansible.builtin.debug:
    msg: "Generated {{ _cc_generated_files.matched }} file(s) under {{ cc_generate_ref_dir }}"

- name: Archive the generated reference into the reports directory
  ansible.builtin.archive:  # noqa: fqcn[canonical]
    path: "{{ cc_generate_ref_dir }}"
    dest: "{{ cc_reports_dir }}/cluster-compare-reference.tar.gz"
    format: gz
    mode: '0644'
...
