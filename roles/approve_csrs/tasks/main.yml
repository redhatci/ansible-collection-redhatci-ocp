- name: Approve pending CSRs
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      oc get csr | { grep -i pending || true; } | cut -f 1 -d ' ' | xargs -rn 1 oc adm certificate approve
  register: _ac_csr_approve
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: _ac_csr_approve.stdout | length > 0

- name: Wait up to an 60 mins for CSRs to be approved  # loop kept: re-approves late CSRs from joining day2 workers
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      oc get csr | grep -i pending | cut -f 1 -d ' ' | xargs -rn 1 oc adm certificate approve &> /dev/null; oc get nodes -o json
  register: oc_nodes
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false  # Wait/poll loop: change reporting is owned by the "Approve pending CSRs" task above
  until: (groups['day2_workers'] | difference(oc_nodes.stdout | default('{}') | from_json | json_query('items[].metadata.name') | list )) | length == 0
  retries: 60
  delay: 60
