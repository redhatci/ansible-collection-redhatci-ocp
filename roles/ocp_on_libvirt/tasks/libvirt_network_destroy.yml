---
- name: "Check if network is defined"
  block:
    - name: "Get network status"
      community.libvirt.virt_net:
        name: "{{ network['name'] }}"
        command: status
      register: _ool_node_exists
  rescue:
    - name: "Network not found — mark as absent"
      ansible.builtin.set_fact:
        _ool_node_exists:
          failed: true

- name: "Destroy network"
  community.libvirt.virt_net:
    name: "{{ network['name'] }}"
    command: destroy
  when: not _ool_node_exists.failed
  failed_when: false

- name: "Undefine network"
  community.libvirt.virt_net:
    name: "{{ network['name'] }}"
    command: undefine
  when: not _ool_node_exists.failed
  failed_when: false
